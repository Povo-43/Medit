name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Medit
            module: app
            gradle_module: :app
            package: com.medit.midi
            apk: app/build/outputs/apk/release/app-release.apk
            build_file: app/build.gradle.kts
            artifact: medit-apk
          - name: MeditDAW
            module: daw
            gradle_module: :daw
            package: com.medit.daw
            apk: daw/build/outputs/apk/release/daw-release.apk
            build_file: daw/build.gradle.kts
            artifact: meditdaw-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "sdkmanager not found under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/release.keystore"
            echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          ./gradlew :shared:testDebugUnitTest ${{ matrix.gradle_module }}:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew ${{ matrix.gradle_module }}:lintDebug --no-daemon --stacktrace

      - name: Build signed release APK
        run: ./gradlew ${{ matrix.gradle_module }}:assembleRelease --no-daemon --stacktrace

      - name: Verify APK integrity
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/34.0.0"
          APK="${{ matrix.apk }}"
          test -f "${APK}"
          "${BUILD_TOOLS}/zipalign" -c 4 "${APK}"
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | tee /dev/stderr | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          test -n "$(unzip -l "${APK}" | awk '/META-INF\/MANIFEST.MF/')"
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${APK}")
          echo "${BADGING}" | head -3
          echo "${BADGING}" | grep -q "^package: name='${{ matrix.package }}'"

      - name: Prepare release artifact
        id: artifact
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' "${{ matrix.build_file }}" | head -1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF_NAME}"
          else
            SUFFIX="dev-${GITHUB_SHA::7}"
          fi
          NAME="${{ matrix.name }}-${VERSION_NAME}-${SUFFIX}.apk"
          mkdir -p dist
          cp "${{ matrix.apk }}" "dist/${NAME}"
          (cd dist && sha256sum "${NAME}" > "${NAME}.sha256")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared ${NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-apk'
          merge-multiple: true
          path: dist

      - name: List release files
        run: ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Medit と MeditDAW の Android APK です。

            | アプリ | パッケージ | 内容 |
            | --- | --- | --- |
            | **Medit** | `com.medit.midi` | ピアノ専用MIDIエディタ（従来版） |
            | **MeditDAW** | `com.medit.daw` | トラック機能・トラック毎の音源選択に対応したDAW版 |

            - 対応バージョン: Android 8.0 (API 26) 以上
            - 署名: リリース署名（v1 / v2 / v3）
            - 2つのアプリは別パッケージなので、同じ端末に並べてインストールできます。

            インストール:

            ```bash
            adb install -r Medit-*.apk
            adb install -r MeditDAW-*.apk
            ```

            - v1.2.1 以前（デバッグ署名）からアップデートする場合は、一度旧アプリをアンインストールしてからインストールしてください。
            - 「パッケージの解析中にエラーが発生しました」と表示される場合は、ダウンロードが完了しているかと Android 8.0 以上かを確認してください。
            - SHA-256 は同名の `.sha256` ファイルにあります。
